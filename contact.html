<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - MindShield</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="contact-page">
    <header>
        <nav class="nav-container">
            <a href="index.html" class="logo">
                <img src="assets/images/mindshield-intro.gif" alt="MindShield Logo" class="logo-img">
            </a>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#technology">Technology</a></li>
                <li><a href="index.html#vaas">VaaS</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contact Form Section -->
    <section class="contact-section">
        <div class="contact-container">
            <h1>Contact Us</h1>
            <p>If you have any questions or would like to get in touch with us, please fill out the form below:</p>

            <!-- Contact Form -->
            <form id="contact-form" class="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="How can we help you?" required></textarea>

                <button type="submit">Send Message</button>
            </form>

            <!-- Thank You Message -->
            <p id="thank-you-message">Thank you for contacting us! We will get back to you soon.</p>
        </div>
    </section>

    <!-- Script to Handle AJAX Form Submission -->
    <script>
        const form = document.getElementById('contact-form');
        const thankYouMessage = document.getElementById('thank-you-message');

        form.addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent default form submission

            const formData = new FormData(form);

            try {
                const response = await fetch('https://formspree.io/f/mblrbnrb', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                    },
                    body: formData
                });

                if (response.ok) {
                    form.reset(); // Clear the form
                    thankYouMessage.style.display = 'block'; // Show thank you message
                } else {
                    alert('There was a problem submitting the form. Please try again.');
                }
            } catch (error) {
                alert('There was a problem submitting the form. Please try again.');
            }
        });

        // Hamburger menu toggle
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('nav-links');

        hamburger.addEventListener('click', function() {
            hamburger.classList.toggle('active');
            navLinks.classList.toggle('active');
            const isExpanded = hamburger.classList.contains('active');
            hamburger.setAttribute('aria-expanded', isExpanded);
        });

        // Close menu when clicking outside
        document.addEventListener('click', function(e) {
            if (!hamburger.contains(e.target) && !navLinks.contains(e.target)) {
                hamburger.classList.remove('active');
                navLinks.classList.remove('active');
                hamburger.setAttribute('aria-expanded', 'false');
            }
        });
    </script>
</body>
</html>
